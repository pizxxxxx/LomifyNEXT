[[permission]]
identifier = "allow-desktop-commands"
description = "Preserve existing desktop commands while account credential commands use a separate restricted permission."
commands.allow = [
  "exit_app",
  "rockium_publish",
  "rockium_configure",
  "check_and_download_update",
  "install_update",
  "get_server_ports",
  "diagnostics_log",
  "discord_connect",
  "discord_disconnect",
  "discord_set_activity",
  "discord_clear_activity",
  "get_os_username",
  "audio_load_file",
  "audio_load_url",
  "audio_play",
  "audio_pause",
  "audio_stop",
  "audio_cancel_load",
  "audio_seek",
  "audio_set_volume",
  "audio_set_playback_rate",
  "audio_set_ab_loop",
  "audio_get_position",
  "audio_playback_clock",
  "audio_set_eq",
  "audio_set_normalization",
  "audio_set_spatial",
  "audio_is_playing",
  "audio_set_metadata",
  "audio_set_playback_state",
  "audio_set_media_position",
  "audio_list_devices",
  "audio_switch_device",
  "audio_set_follow_default_output",
  "audio_set_lyrics_timeline",
  "audio_clear_lyrics_timeline",
  "audio_set_comments_timeline",
  "audio_clear_comments_timeline",
  "audio_preview_play",
  "audio_preview_stop",
  "save_track_to_path",
  "spotify_oauth_start",
  "track_ensure_cached",
  "track_export",
  "track_is_cached",
  "track_transcode_status",
  "track_get_cache_path",
  "track_get_cache_info",
  "track_preload",
  "track_cache_size",
  "track_liked_cache_size",
  "track_clear_cache",
  "track_clear_liked_cache",
  "track_remove_cached",
  "track_list_cached",
  "track_cache_inventory",
  "track_enforce_cache_limit",
  "track_smart_cleanup",
  "track_cache_likes",
  "track_cache_likes_running",
  "track_cancel_cache_likes",
  "image_cache_size",
  "image_cache_clear",
  "image_cache_prune",
  "call_set_enabled",
  "call_is_enabled",
  "call_status",
  "wallpaper_search",
  "net_fetch_direct",
  "soundcloud_fetch_text",
  "soundcloud_bypass_start",
  "soundcloud_bypass_stop",
