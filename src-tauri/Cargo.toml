[package]
name = "lomifynext-tauri"
version = "9.1.0"
description = "LomifyNEXT"
authors = ["dopaminegdev"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lomifynext_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` used to be listed here unconditionally, which compiles the web inspector
# into release builds too — any user could press F12 and get a console. Tauri already
# enables the inspector automatically on debug builds, so `cargo tauri dev` is
# unaffected; a shipped `cargo tauri build` now simply has no inspector to open.
# Need it in a release build to chase a bug? `cargo tauri build --features devtools`.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-liquid-glass = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "process"] }
warp = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json", "socks"], default-features = false }
futures-util = "0.3"
http = "1"
urlencoding = "2"
tauri-plugin-single-instance = "2"
rodio = { version = "0.22.2", features = ["mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-ogg"] }
cpal = "0.17"
biquad = "0.5"
rustfft = { version = "6", default-features = false }
souvlaki = "0.8"
raw-window-handle = "0.6"
ogg = "0.9.2"
audiopus = "0.2.0"
chrono = { version = "0.4", features = ["clock"] }
libc = "0.2"
url = "2"
regex = { version = "1", default-features = false, features = ["std"] }
bytes = "1"
tracing = "0.1"
ffmpeg-sidecar = "2.5.2"
discord-rich-presence = "1"

call-client = { path = "../utils/call/client" }
decrypt-client = { path = "../utils/decrypt-client" }
tauri-plugin-window-state = "2.4.1"

[features]
# Opt-in escape hatch: `cargo tauri build --features devtools` puts the inspector back
# into a release build for local debugging. Off by default so shipped builds stay locked.
devtools = ["tauri/devtools"]

[patch.crates-io]
brotli = { git = "https://github.com/dropbox/rust-brotli.git" }
